<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Pink to Orange Diagonal Gradient -->
    <linearGradient id="camFaviconGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff007f" />
      <stop offset="50%" stop-color="#ff1a68" />
      <stop offset="100%" stop-color="#ff8c00" />
    </linearGradient>
  </defs>

  <!-- Rounded Square Container (Squircle) -->
  <rect width="512" height="512" rx="130" fill="url(#camFaviconGrad)" />

  <!-- White Camera Line Icon -->
  <g transform="translate(106, 120)">
    <!-- Camera Body Outline -->
    <path
      d="M 68 44 
         C 68 30, 80 20, 100 20 
         L 200 20 
         C 220 20, 232 30, 232 44 
         L 248 44 
         C 275 44, 296 65, 296 92 
         L 296 224 
         C 296 251, 275 272, 248 272 
         L 52 272 
         C 25 272, 4 251, 4 224 
         L 4 92 
         C 4 65, 25 44, 52 44 
         Z"
      fill="none"
      stroke="#ffffff"
      stroke-width="28"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <!-- Center Camera Lens -->
    <circle
      cx="150"
      cy="158"
      r="52"
      fill="none"
      stroke="#ffffff"
      stroke-width="28"
    />
  </g>
</svg>
